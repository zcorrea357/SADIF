# Infraestrutura local do SADIF.
#
#   docker compose -f infra/docker-compose.yml --env-file .env up -d                      # MongoDB
#   docker compose -f infra/docker-compose.yml --env-file .env --profile tools up -d      # + mongo-express
#   docker compose -f infra/docker-compose.yml --env-file .env --profile thehive up -d    # + TheHive 5
#
# Todas as portas são publicadas apenas em 127.0.0.1.
name: sadif

services:

  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"

  cassandra:
    image: cassandra:4.1
    profiles: [thehive]
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: TheHive
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    profiles: [thehive]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  thehive:
    image: strangebee/thehive:${THEHIVE_VERSION:-5.4}
    profiles: [thehive]
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      JVM_OPTS: -Xms1024M -Xmx1024M
    command:
      - --secret
      - ${THEHIVE_SECRET:?defina THEHIVE_SECRET no .env}
      - --cql-hostnames
      - cassandra
      - --index-backend
      - elasticsearch
      - --es-hostnames
      - elasticsearch
      - --no-config-cortex
    volumes:
      - thehive-data:/opt/thp/thehive/files
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    ports:
      - "127.0.0.1:${THEHIVE_PORT:-9000}:9000"

volumes:
  mongodb-data:
  cassandra-data:
  elasticsearch-data:
  thehive-data:
